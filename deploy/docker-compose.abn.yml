services:
  sleeve-a-opt4:
    image: freqtradeorg/freqtrade:2026.8
    container_name: ft-abn-a
    volumes:
      - ./:/freqtrade
    command: >
      trade --config deploy/config_sleeve_a.json
      --strategy OPT4_VolatilitySystem
      --db-url sqlite:////freqtrade/user_data/tradesv3_abn_a.dryrun.sqlite
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  sleeve-b-momregime:
    image: freqtradeorg/freqtrade:2026.8
    container_name: ft-abn-b
    volumes:
      - ./:/freqtrade
    command: >
      trade --config deploy/config_sleeve_b.json
      --strategy OPT2_MomRegime15mLb21
      --db-url sqlite:////freqtrade/user_data/tradesv3_abn_b.dryrun.sqlite
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  sleeve-c-nfilite:
    image: freqtradeorg/freqtrade:2026.8
    container_name: ft-abn-c
    volumes:
      - ./:/freqtrade
    command: >
      trade --config deploy/config_sleeve_c.json
      --strategy OPT7_NFILite
      --db-url sqlite:////freqtrade/user_data/tradesv3_abn_c.dryrun.sqlite
    ports:
      - "127.0.0.1:8083:8080"
    restart: unless-stopped

  # 自调度任务器：每日 00:10Z 数据刷新 + 00:40Z 组合监控（详见 scheduler_loop.sh）
  abn-scheduler:
    image: freqtradeorg/freqtrade:2026.8
    container_name: ft-abn-scheduler
    volumes:
      - ./:/freqtrade
    entrypoint: ["/bin/sh", "/freqtrade/deploy/scheduler_loop.sh"]
    restart: unless-stopped
