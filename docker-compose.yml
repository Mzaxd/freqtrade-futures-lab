services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.8
    container_name: freqtrade-futures-lab
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/ft_container.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/configs/config_futures.json
      --strategy TrendBaselineV1
    restart: unless-stopped
